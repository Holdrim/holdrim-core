# Brings Holdrim up on your machine. Once, the key the server signs every event with — readable by
# you alone, and kept out of the repository and out of the data volume, since whoever holds it can
# sign a lock (SECURITY.md, "The signing key"):
#
#   export HOLDRIM_OWNER=you@example.org
#   docker compose run --rm --no-deps -u "$(id -u)" -v "$PWD:/out" holdrim /usr/local/bin/node engine/cli/holdrim.ts key new /out/holdrim-signing.key
#
# and then, every time:
#
#   HOLDRIM_SIGNING_KEY="$(cat holdrim-signing.key)" docker compose up
#
# The first-access password is never in the log; read it from the data volume, then sign in:
#
#   docker compose exec holdrim /bin/cat /data/first-access-password
#
# The first sign-in forces a change, and the file is removed when the password changes.
# Without HOLDRIM_SITE, it comes up with the example (examples/hello-world).
services:
  holdrim:
    build: .
    ports:
      - "${HOLDRIM_PORT:-8080}:8080"
    environment:
      HOLDRIM_OWNER: "${HOLDRIM_OWNER:?set HOLDRIM_OWNER to the e-mail of whoever approves}"
      # Empty rather than refused here, so the one-time `run` above can make the key before one
      # exists; the service itself refuses to start on an empty key, and says how to make one.
      HOLDRIM_SIGNING_KEY: "${HOLDRIM_SIGNING_KEY:-}"
      HOLDRIM_ENVIRONMENT: Production
      # Point it at your mounted documentation (see the commented volume below).
      HOLDRIM_SITE: "${HOLDRIM_SITE:-/app/examples/hello-world}"
    volumes:
      # Where the events and the people live.
      #
      # A NAMED volume, not a host folder, on purpose: the process runs as `node` (uid 1000) and a
      # host folder arrives with the host's owner — the image chown does not reach a bind mount,
      # and SQLite dies with "unable to open database file". The named volume inherits the image's
      # owner. If you really want the folder next to you:  mkdir -p data && sudo chown 1000:1000 data
      - data:/data
      # YOUR documentation. Uncomment, adjust the path, and set HOLDRIM_SITE=/content in the
      # environment above.
      # - ./my-docs:/content:ro

volumes:
  data:
