# Publishes the engine's image when a version tag is pushed — and only then, and only after proof.
#
# AGENTS.md: a tag must point at a commit whose CI is green — otherwise the next version exists only
# to say "use this one instead". A rule written down is a rule somebody forgets at eleven at night,
# so this workflow enforces it:
#   1. guard   — the tag is vMAJOR.MINOR.PATCH, equals package.json, and is on main;
#   2. proofs  — the whole test workflow runs again on exactly the tagged commit;
#   3. publish — only then is the image built and pushed, with provenance and an SBOM attached so
#                an adopter can check what they pulled and what is inside it.
#
# There is no `latest` tag, on purpose. Adopters PIN a version; `latest` is the one tag that moves
# under them, and a deployment that says `latest` upgrades itself on the next restart.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Two pushes of the same tag must not publish twice at once, and a release in progress is never
# cancelled halfway through a push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so the guard can see whether the tagged commit is on main.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  proofs:
    needs: guard
    uses: ./.github/workflows/tests.yml

  publish:
    needs: proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write          # to push to this repository's own container registry; nothing else
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The registry wants a lowercase name, and the organisation's is not. Computed here rather than
      # written out, so a fork publishes to its own namespace and never to this one.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.2.0 and 0.2 — the exact release, and the line an adopter who takes patches can follow.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
